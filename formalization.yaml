# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The optimal Hessian bound for convex four-body central configurations"
  description: >-
    A Lean 4 and Mathlib formalization of Conjecture 7.3 of arXiv:2609.35632 on the
    central configurations of the planar Newtonian four-body problem. At every strictly
    convex central configuration of four positive masses, the Hessian form Q of U +
    (λ/2)I is at least two thirds of its radial part K, and strictly so wherever K is
    positive. In the notation of the paper this is λ_max(G) < 1/3 for the explicit 2×2
    matrix G of its Proposition 3.5, and by its Proposition 7.2 the constant 2/3 is
    optimal. It sharpens Theorem B of the paper, Q ≥ K/4. The definitions and the
    reduction to the normal form of Corbera, Cors and Roberts are those of the
    registered development lean4body-uniqueness. The new parts are a majorant that pays
    only the largest eigenvalue of S(y), an exact test that is positive definite exactly
    when λ_max(G) < 1/3, and a computer-assisted proof of that test: a branch and bound
    with interval arithmetic over the three-dimensional set of normalized convex central
    configurations, reduced by a symmetry to half of it, and an exact Taylor-form
    theorem at the corner where the margin of the test vanishes. Lean's kernel checks
    the certificates with `decide +kernel`. The trusted base is Lean's kernel, including
    its built-in arithmetic on natural-number literals (GMP-accelerated), and the proofs
    use only Lean's three standard axioms.
  authors:
    - "Tejasvi Singh Tomar"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tejasvi Singh Tomar"

classification:
  arxiv: [math.DS, math-ph]
  msc2020: [70F10, 70F15, 65G40]

sources:
  - title: "Uniqueness of four-body convex central configurations for all masses"
    authors:
      - "Tejasvi Singh Tomar"
    id: "arXiv:2609.35632"
    type: paper
    location: "https://arxiv.org/abs/2609.35632"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The paper and this formalization have the same author. Conjecture 7.3 of the
      paper states λ_max(G) < 1/3 at every convex central configuration, and hence
      Q ≥ (2/3)K. This formalization proves Q ≥ (2/3)K, and the strict inequality
      wherever K > 0, which is equivalent to λ_max(G) < 1/3 by Proposition 3.5(c) of
      the paper.
  - title: "Classifying four-body convex central configurations"
    authors:
      - "Montserrat Corbera"
      - "Josep M. Cors"
      - "Gareth E. Roberts"
    id: "doi:10.1007/s10569-019-9911-7"
    type: paper
    location: "Celest. Mech. Dyn. Astron. 131 (2019), Paper No. 34"
    relationship: background
    note: >-
      The coordinates and the normal form of convex central configurations in which
      the computation is done.

related_formalizations:
  - id: "https://palomar-registry.org/entry.html?id=PALOMAR-2026-10-02-000011&version=1"
    relationship: adapts
    note: >-
      lean4body-uniqueness (PALOMAR-2026-10-02-000011), version 1: Theorem A of the
      paper, with the Hessian bound Q ≥ K/128; version 2 of the same entry proves
      Theorem B, Q ≥ K/4, with the same chain. This repository copies from version 1,
      verbatim, the definitions, the reduction to the normal form, the interval
      arithmetic and its soundness proofs, and adds the sharp majorant, the midpoint
      test, a new checker and new certificates.
  - id: "https://github.com/tejasvi/lean4body/tree/58ac0fbf4d664fb80abaedf66d0c68c2cf6644cc"
    relationship: other
    note: >-
      lean4body, release v1.0, cited by the paper: Theorems A and B, with the constant
      1/4 of Theorem B.

status:
  scope: >-
    Formalized: Conjecture 7.3 of the paper in the form Q ≥ (2/3)K (C4.conj_sharp) and
    its strict form, Q > (2/3)K wherever K > 0 (C4.conj_sharp_strict). Not formalized:
    the optimality of the constant 2/3 (Proposition 7.2(d) of the paper), and the
    matrix G with the equivalence of Proposition 3.5(c); the theorems are stated
    through Q and K.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "C4.conj_sharp"
      file: "C4/ConjSharp.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"
    - declaration: "C4.conj_sharp_strict"
      file: "C4/ConjSharp.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: agent
      tool_setup: >-
        Generative AI tools (publicly available models) were used to write this Lean
        formalization and its certificate generator.
  notes: >-
    The certificate hints are written by an unverified program that is not part of
    this repository or of the trusted base; Lean's kernel checks every certificate,
    so the hints are not trusted.

fidelity:
  divergences: >-
    The conjecture is stated in the paper as λ_max(G) < 1/3; the compared statements
    are the equivalent inequalities between the quadratic forms Q (C4.hessQ) and K
    (C4.hessK), Q ≥ (2/3)K and its strict form for K > 0. C4.hessQ is defined by the
    formula of Lemma 2.1(a) of the paper; lean4body-uniqueness proves that it is the
    Hessian of U + (λ/2)I (C4.hessian_Phi). Bodies are indexed by Fin 4, so the
    paper's bodies 1, 2, 3, 4 are 0, 1, 2, 3, and a configuration is a map
    Fin 4 → ℝ × ℝ. Division is total in Lean (x / 0 = 0); the quantities divided by in
    the definitions (r_ij for i ≠ j, I and M) are nonzero at every collision-free
    configuration of positive masses. Convexity (IsConvex) is defined by the signs of
    the four oriented areas; lean4body-uniqueness proves that this holds exactly when
    the bodies are the vertices of a strictly convex quadrilateral.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The proofs are checked by Lean's kernel. On the build machine, with the kernels run
    in the registry's order and settings, lake comparator's statement and axiom checks
    pass on the final exports (the statements and the definitions they use match
    Challenge.lean, and the only axioms are propext, Classical.choice and Quot.sound),
    and con-ron (16 workers, 1,085 s), nanoda (4 threads, 863 s) and leanchecker (one
    thread, 4,975 s) each accept the Solution export. Two negative controls are rejected
    by lake comparator: a Solution with a sorry ("Illegal axiom detected: 'sorryAx'")
    and a Solution with a changed statement ("Challenge and solution theorem statement
    do not match: 'C4.conj_sharp'").

alignment:
  namespace: "C4"
  statements:
    - source: "Conjecture 7.3, the bound Q ≥ (2/3)K at every convex central configuration"
      lean: "C4.conj_sharp"
      module: "C4.ConjSharp"
      status: proved
    - source: "Conjecture 7.3, λ_max(G) < 1/3, in the equivalent form Q > (2/3)K wherever K > 0"
      lean: "C4.conj_sharp_strict"
      module: "C4.ConjSharp"
      status: proved
      note: >-
        Equivalent to λ_max(G) < 1/3 by Proposition 3.5(c) of the paper, which is not
        formalized here.

acknowledgements: >-
  The formalization uses Lean 4 and Mathlib. Its verification replays the proofs in
  Lean's kernel and in the type checker nanoda; the registry's runner also attempts
  con-ron.
